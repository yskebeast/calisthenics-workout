openapi: 3.1.0
info:
  title: Widget Service
  version: 0.0.0
tags: []
paths:
  /test:
    get:
      operationId: test
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
components:
  schemas:
    Test:
      type: object
      required:
        - id
        - name
        - language
      properties:
        id:
          type: string
        name:
          type: string
        language:
          $ref: '#/components/schemas/TestEnum'
    TestEnum:
      type: string
      enum:
        - python
        - typescript
        - ruby
